name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 mypy black isort

      - name: Black (code formatting check)
        run: black --check .claude/skills/voacap/scripts/

      - name: isort (import sorting check)
        run: isort --check-only .claude/skills/voacap/scripts/

      - name: Flake8
        run: flake8 .claude/skills/voacap/scripts/ --max-line-length=120

      - name: Pylint
        run: pylint .claude/skills/voacap/scripts/*.py --disable=too-many-locals,too-many-branches --exit-zero

      - name: MyPy (type checking)
        run: mypy .claude/skills/voacap/scripts/ --ignore-missing-imports --no-error-summary || true

  unit-tests:
    name: Python unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          mkdir -p .claude/skills/voacap/tests
          python -m pytest .claude/skills/voacap/tests/ -v --tb=short --cov=.claude/skills/voacap/scripts --cov-report=xml --cov-report=term || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests-py${{ matrix.python-version }}
          fail_ci_if_error: false

  integration-tests:
    name: Integration tests against voacapl
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            voacapl-version: ""  # latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran automake autoconf libtool m4 pkg-config

      - name: Resolve voacapl version
        id: voacapl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${{ matrix.voacapl-version }}" ]; then
            TAG=$(gh api repos/jawatson/voacapl/releases/latest --jq .tag_name)
          else
            TAG="${{ matrix.voacapl-version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build voacapl
        env:
          VOACAPL_TAG: ${{ steps.voacapl.outputs.tag }}
        run: .claude/skills/voacap/scripts/setup.sh --release "$VOACAPL_TAG"

      - name: Run smoke tests
        env:
          VOACAP_ITSHFBC: ${{ home }}/itshfbc
        run: .claude/skills/voacap/scripts/run_tests.sh

      - name: Run extended integration tests
        run: |
          set -e
          echo "=== Extended Integration Tests ==="
          SCRIPT_DIR=".claude/skills/voacap/scripts"
          ITSHFBC="$HOME/itshfbc"
          
          # Test with different parameters
          echo "Testing different SSN values..."
          for SSN in 30 80 150; do
            python3 "$SCRIPT_DIR/voacap_predict.py" \
              --tx-name "Test" --tx-lat 0 --tx-lon 0 \
              --rx-name "Test" --rx-lat 45 --rx-lon 45 \
              --month 6 --ssn "$SSN" --freqs 7.1 14.2 > /dev/null
            echo "  SSN=$SSN: OK"
          done
          
          # Test edge cases
          echo "Testing edge case locations..."
          python3 "$SCRIPT_DIR/voacap_predict.py" \
            --tx-name "Equator" --tx-lat 0 --tx-lon 0 \
            --rx-name "Pole" --rx-lat 89.9 --rx-lon 0 \
            --month 3 --ssn 60 --freqs 10.1 > /dev/null
          echo "  Equator to Pole: OK"
          
          # Test all months
          echo "Testing seasonal variations..."
          for MONTH in 1 6 12; do
            python3 "$SCRIPT_DIR/voacap_predict.py" \
              --tx-name "EU" --tx-lat 50 --tx-lon 10 \
              --rx-name "US" --rx-lat 40 --rx-lon -75 \
              --month "$MONTH" --ssn 70 --freqs 14.2 > /dev/null
            echo "  Month=$MONTH: OK"
          done
          
          # Test output format variations
          echo "Testing output formats..."
          python3 "$SCRIPT_DIR/voacap_predict.py" \
            --tx-name "Test" --tx-lat 0 --tx-lon 0 \
            --rx-name "Test" --rx-lat 30 --rx-lon 30 \
            --month 6 --ssn 60 --freqs 7.1 --json > /tmp/test_output.json
          python3 -m json.tool /tmp/test_output.json > /dev/null
          echo "  JSON output: OK"

      - name: Report integration test results
        if: always()
        run: |
          echo "voacapl version: ${{ steps.voacapl.outputs.tag }}"
          voacapl -v 2>&1 || echo "(voacapl -v not available)"
