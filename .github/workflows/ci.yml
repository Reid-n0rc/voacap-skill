name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether anything besides docs/ changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "No usable base SHA (new branch or shallow history) - running full CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qvE '^(docs/|README\.md$|\.github/workflows/pages\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint and type check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 mypy black isort

      - name: Black (code formatting check)
        run: black --check .claude/skills/voacap/scripts/ || true

      - name: isort (import sorting check)
        run: isort --check-only .claude/skills/voacap/scripts/ || true

      - name: Flake8
        run: flake8 .claude/skills/voacap/scripts/ --max-line-length=120 || true

      - name: Pylint
        run: pylint .claude/skills/voacap/scripts/*.py --disable=too-many-locals,too-many-branches,consider-using-f-string --exit-zero || true

      - name: MyPy (type checking)
        run: mypy .claude/skills/voacap/scripts/ --ignore-missing-imports --no-error-summary || true

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: vendor local

  unit-tests:
    name: Python unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Create tests directory if needed
        run: mkdir -p .claude/skills/voacap/tests

      - name: Run unit tests
        run: |
          python -m pytest .claude/skills/voacap/tests/ -v --tb=short 2>/dev/null || echo "No unit tests found (yet)"

  integration-tests:
    name: Integration tests against voacapl
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran automake autoconf libtool m4 pkg-config

      - name: Resolve voacapl version
        id: voacapl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/jawatson/voacapl/releases/latest --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved voacapl version: $TAG"

      - name: Build voacapl
        run: .claude/skills/voacap/scripts/setup.sh --release "${{ steps.voacapl.outputs.tag }}"

      - name: Run smoke tests
        run: .claude/skills/voacap/scripts/run_tests.sh

      - name: Run extended integration tests
        run: |
          set -e
          echo "=== Extended Integration Tests ==="
          SCRIPT_DIR=".claude/skills/voacap/scripts"
          
          # Test with different parameters
          echo "Testing different SSN values..."
          for SSN in 30 80 150; do
            python3 "$SCRIPT_DIR/voacap_predict.py" \
              --tx-name "Test" --tx-lat 0 --tx-lon 0 \
              --rx-name "Test" --rx-lat 45 --rx-lon 45 \
              --month 6 --ssn "$SSN" --freqs 7.1 14.2 > /dev/null
            echo "  SSN=$SSN: OK"
          done
          
          # Test edge cases
          echo "Testing edge case locations..."
          python3 "$SCRIPT_DIR/voacap_predict.py" \
            --tx-name "Equator" --tx-lat 0 --tx-lon 0 \
            --rx-name "Pole" --rx-lat 89.9 --rx-lon 0 \
            --month 3 --ssn 60 --freqs 10.1 > /dev/null
          echo "  Equator to Pole: OK"
          
          # Test all months
          echo "Testing seasonal variations..."
          for MONTH in 1 6 12; do
            python3 "$SCRIPT_DIR/voacap_predict.py" \
              --tx-name "EU" --tx-lat 50 --tx-lon 10 \
              --rx-name "US" --rx-lat 40 --rx-lon -75 \
              --month "$MONTH" --ssn 70 --freqs 14.2 > /dev/null
            echo "  Month=$MONTH: OK"
          done
          
          # Test output format variations
          echo "Testing output formats..."
          python3 "$SCRIPT_DIR/voacap_predict.py" \
            --tx-name "Test" --tx-lat 0 --tx-lon 0 \
            --rx-name "Test" --rx-lat 30 --rx-lon 30 \
            --month 6 --ssn 60 --freqs 7.1 --json > /tmp/test_output.json
          python3 -m json.tool /tmp/test_output.json > /dev/null
          echo "  JSON output: OK"

      - name: Report integration test results
        if: always()
        run: |
          echo "voacapl version: ${{ steps.voacapl.outputs.tag }}"
          voacapl -v 2>&1 || echo "(voacapl -v not available)"

  install-script:
    name: Test one-command installer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately does NOT pre-install gfortran/automake/autoconf: this
      # is the one job that exercises install.sh's own apt-get/brew
      # dependency bootstrap (install_build_deps), which every other CI
      # job bypasses by installing build deps itself before calling
      # setup.sh directly.
      - name: Run install.sh against this commit
        env:
          VOACAP_SKILL_REPO_URL: ${{ github.workspace }}
        run: sh install.sh

      - name: Verify the skill landed in ~/.claude/skills/voacap
        run: |
          test -f "$HOME/.claude/skills/voacap/scripts/voacap_predict.py"
          test -x "$HOME/.claude/skills/voacap/scripts/setup.sh"

      - name: Run a prediction against the installed skill
        run: |
          python3 "$HOME/.claude/skills/voacap/scripts/voacap_predict.py" \
            --tx-name "London" --tx-lat 51.5 --tx-lon -0.13 \
            --rx-name "New York" --rx-lat 40.7 --rx-lon -74.0 \
            --month 9 --ssn 60 --freqs 7.1 14.2 21.2 --json > /tmp/install_test.json
          python3 -c "
          import json
          data = json.load(open('/tmp/install_test.json'))
          assert len(data['hours']) == 24, data
          print('OK: installed skill produced a valid 24-hour prediction')
          "

      - name: Re-run install.sh to confirm it's idempotent
        env:
          VOACAP_SKILL_REPO_URL: ${{ github.workspace }}
        run: sh install.sh
